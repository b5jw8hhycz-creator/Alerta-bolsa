<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Alerta Bolsa</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
  background:#f4f5f7;
  margin:0;
  color:#111827
}
.wrap{
  max-width:620px;
  margin:auto;
  padding:20px
}
.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 4px 18px #00000010
}
h1{
  margin:4px 0
}
input,select,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  box-sizing:border-box;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:16px
}
button{
  background:#111827;
  color:white;
  border:0
}
.alert{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-top:10px
}
.muted{
  color:#6b7280;
  font-size:14px
}
.price{
  font-size:24px;
  font-weight:bold;
  margin:10px 0;
}
.price-status{
  font-size:14px;
  color:#6b7280;
}
.checks label{
  display:block;
  margin:9px 0
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📈 Alerta Bolsa</h1>
<div class="muted">
Crea alertas de precio para acciones, ETFs y FIBRAs.
</div>
<input
  id="ticker"
  placeholder="Ticker: TSLA, NVDA, FUNO11.MX"
  oninput="tickerChanged()"
  autocomplete="off"
>
<div id="priceStatus" class="price-status"></div>
<div id="currentPrice" class="price"></div>
<input
  id="target"
  type="number"
  step="0.01"
  placeholder="Precio objetivo"
>
<select id="direction">
<option value="above">
Avisar cuando llegue o supere el precio
</option>
<option value="below">
Avisar cuando llegue o baje del precio
</option>
</select>
<div class="checks">
<b>Notificar por:</b>
<label>
<input type="checkbox" value="app"> 📱 App
</label>
<label>
<input type="checkbox" value="email"> ✉️ Email
</label>
<label>
<input type="checkbox" value="telegram"> Telegram
</label>
<label>
<input type="checkbox" value="discord"> Discord
</label>
<label>
<input type="checkbox" value="whatsapp"> WhatsApp
</label>
</div>
<button onclick="addAlert()">
Crear alerta
</button>
</div>
<div class="card">
<h2>Mis alertas</h2>
<div id="list" class="muted">
Cargando…
</div>
</div>
</div>
<script>
let priceTimer = null;
function tickerChanged(){
  clearTimeout(priceTimer);
  const ticker =
    document.getElementById('ticker').value
    .trim()
    .toUpperCase();
  const status =
    document.getElementById('priceStatus');
  const price =
    document.getElementById('currentPrice');
  price.innerHTML = '';
  if(!ticker){
    status.innerHTML = '';
    return;
  }
  status.innerHTML = 'Consultando precio…';
  priceTimer = setTimeout(
    () => getCurrentPrice(ticker),
    500
  );
}
async function getCurrentPrice(ticker){
  const status =
    document.getElementById('priceStatus');
  const price =
    document.getElementById('currentPrice');
  try{
    const r =
      await fetch(
        '/api/price/' +
        encodeURIComponent(ticker)
      );
    if(!r.ok){
      throw new Error('Precio no disponible');
    }
    const data = await r.json();
    price.innerHTML =
      '💰 $' +
      Number(data.price).toFixed(2);
    status.innerHTML =
      ticker + ' · Precio actual';
  }catch(error){
    price.innerHTML = '';
    status.innerHTML =
      '⚠️ No se pudo obtener el precio';
  }
}
async function load(){
  const r =
    await fetch('/api/alerts');
  const a =
    await r.json();
  const l =
    document.getElementById('list');
  l.innerHTML =
    a.length
    ? a.map(x =>
      `<div class="alert">
        <b>${x.ticker}</b>
        — ${x.direction==='above'?'≥':'≤'} ${x.target}
        <br>
        <span class="muted">
        Canales:
        ${(x.channels||[]).join(', ')||'ninguno'}
        · ${x.active?'Activa':'Disparada'}
        </span>
        <button onclick="del('${x.id}')">
        Eliminar
        </button>
      </div>`
    ).join('')
    : 'No tienes alertas todavía.';
}
async function addAlert(){
  const channels =
    [...document.querySelectorAll(
      '.checks input:checked'
    )].map(x => x.value);
  const body = {
    ticker:
      document.getElementById('ticker').value,
    target:
      document.getElementById('target').value,
    direction:
      document.getElementById('direction').value,
    channels
  };
  const r =
    await fetch('/api/alerts',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify(body)
    });
  if(!r.ok){
    alert(
      'Revisa el ticker y precio objetivo'
    );
    return;
  }
  document.getElementById('ticker').value='';
  document.getElementById('target').value='';
  document.getElementById('currentPrice').innerHTML='';
  document.getElementById('priceStatus').innerHTML='';
  document.querySelectorAll(
    '.checks input'
  ).forEach(x => x.checked=false);
  load();
}
async function del(id){
  await fetch(
    '/api/alerts/' + id,
    {
      method:'DELETE'
    }
  );
  load();
}
load();
</script>
</body>
</html>
